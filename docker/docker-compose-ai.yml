# new-api 独立 stack：应用数据存 MySQL、缓存用 Redis，复用 data stack 的 x-mysql / x-redis。
# 启动前在 docker/.env 配置 NEWAPI_SQL_DSN、NEWAPI_SESSION_SECRET、NEWAPI_REDIS_CONN_STRING（必填）并先启动 data stack；
# 生产经 Nginx HTTPS 部署时，再同时设置 NEWAPI_SESSION_COOKIE_SECURE=true 和 NEWAPI_SESSION_COOKIE_TRUSTED_URL。
# 宿主机端口 9960 → 容器 3000；Nginx 反代复制 nginx/conf.d/router.conf.sample 为 router.conf 后按实际域名/证书调整。
services:
  x-new-api:
    container_name: x-new-api
    image: calciumion/new-api:v1.0.0-rc.48
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "9960:3000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/new-api/data:/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/new-api/logs:/app/logs
    extra_hosts:
      # 通过宿主机端口访问 data stack 的 x-mysql（6306）/ x-redis（6379），不共享 Docker 网络
      - "host.docker.internal:host-gateway"
    environment:
      # 必填：Go MySQL DSN，例如 user:password@tcp(host.docker.internal:6306)/dbname?charset=utf8mb4&parseTime=True&loc=Local
      SQL_DSN: "${NEWAPI_SQL_DSN:?NEWAPI_SQL_DSN must be set in docker/.env}"
      # 必填：持久化会话密钥，使用 openssl rand -hex 32 生成
      SESSION_SECRET: "${NEWAPI_SESSION_SECRET:?NEWAPI_SESSION_SECRET must be set in docker/.env}"
      # 必填：复用 data stack 的 x-redis；12 号为 new-api 专用库（new-api 仅接受 0–15），密码需 URL 编码
      # 例如 redis://:<url-encoded-password>@host.docker.internal:6379/12
      REDIS_CONN_STRING: "${NEWAPI_REDIS_CONN_STRING:?NEWAPI_REDIS_CONN_STRING must be set in docker/.env}"
      # 可选：SESSION_COOKIE_SECURE 默认 false；设为 true 时必须同时给出精确的 HTTPS Origin，否则 new-api 启动失败
      SESSION_COOKIE_SECURE: "${NEWAPI_SESSION_COOKIE_SECURE:-false}"
      SESSION_COOKIE_TRUSTED_URL: "${NEWAPI_SESSION_COOKIE_TRUSTED_URL:-}"
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: x-new-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - net-ai

networks:
  net-ai:
    driver: bridge