# ============================================================
# Redis 8.8.4 standalone configuration
#
# 适用：docker/docker-compose-data.yml 的 x-redis（redis:8.8.4）
# 挂载：docker/redis/redis.conf -> /etc/redis.conf
# 数据：docker/redis/data -> /data
# 启动：redis-server /etc/redis.conf --requirepass "$REDIS_PASSWORD"（由 compose 注入）
#
# 安全提示：
# compose 通过 REDIS_PASSWORD 注入 requirepass，密码默认值仅用于本地启动；
# 生产必须在 docker/.env 或 secret 中覆盖，禁止提交 .env。
# 端口映射统一不限制 IP，由宿主机外部防火墙限制来源网段。
#
# 宿主内核建议（Redis 无法在配置文件中设置，需部署机确认）：
#   net.core.somaxconn >= 4096       # 与 tcp-backlog 匹配
#   vm.overcommit_memory = 1         # 避免 BGSAVE fork 失败
#   Transparent Huge Pages 建议关闭（本配置另设 disable-thp yes）
# ============================================================

################################## NETWORK ##################################

# 容器内监听所有 IPv4/IPv6 接口；写 127.0.0.1 会导致 Docker 发布端口无法访问。
# "-::*" 表示 IPv6 不可用时忽略，不阻塞启动。
bind * -::*

# 已通过 requirepass 启用认证；protected-mode 保持 yes，作为密码未生效或
# 误配置时的兜底，避免 Redis 直接暴露在网络上。
protected-mode yes

port 6379

# 已完成 listen(2) 但尚未 accept(2) 的连接队列长度。
# 容器内可设置较大值；宿主机 net.core.somaxconn 更小时 Redis 会告警并按内核值截断。
tcp-backlog 4096

# 客户端空闲超时；0 表示不主动断开，避免连接池被误杀。
timeout 0

# TCP keepalive 探测间隔，用于及时发现失效连接。
tcp-keepalive 300

################################## GENERAL ###################################

# Docker 前台运行，不能 daemonize；容器编排由 compose 负责。
daemonize no
supervised no

# Redis 在前台运行，pidfile 仅用于进程识别；容器内不写 /var/run。
pidfile /tmp/redis_6379.pid

# 日志输出到 stdout，由 docker logs 收集；生产不要写容器内文件。
loglevel notice
logfile ""

# 默认 16 个逻辑库，保持与常见客户端/应用配置兼容。
databases 16

always-show-logo no

################################## SECURITY ##################################

# 禁止运行时通过 CONFIG 修改 dir/dbfilename 等受保护配置；
# 调试命令与模块加载默认关闭，减少攻击面。
enable-protected-configs no
enable-debug-command no
enable-module-command no

# 认证由 compose 的 command 从 REDIS_PASSWORD 注入：
#   redis-server /etc/redis.conf --requirepass "$REDIS_PASSWORD"
# 不要把密码写入本文件或提交到仓库。

################################## CLIENTS ###################################

# 最大客户端数；实际值还会受容器 nofile 限制，Redis 会按 ulimit 自动下调。
maxclients 10000

# 客户端输出缓冲上限，防止慢消费者耗尽内存；保持 Redis 默认值。
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

################################## MEMORY ####################################

# 本值用于直接以 redis-server /etc/redis.conf 启动的场景；compose 会通过
# --maxmemory "${REDIS_MAXMEMORY:-512m}" 覆盖。容器上限 REDIS_MEM_LIMIT
# 默认 768m，应高于 maxmemory，给客户端缓冲、RDB COW 和内存碎片留余量。
# used_memory 是运行时指标，不是配置项；用 redis-cli INFO memory 查看，
# 建议外部告警阈值按 maxmemory 的 80% 左右设置。
# 纯缓存场景可改用 allkeys-lru；持久化数据场景保留 noeviction，并做容量规划。
maxmemory 512mb
maxmemory-policy noeviction
maxmemory-samples 5

# 异步释放大对象，降低 DEL / EXPIRE / FLUSH 对主线程的阻塞。
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

################################## SNAPSHOTTING ##############################

# RDB 快照点：1 小时 1 次修改 / 5 分钟 100 次 / 1 分钟 10000 次。
# 纯缓存且可接受重启后数据丢失时，可改成 save "" 关闭快照。
save 3600 1 300 100 60 10000

# 最近一次 BGSAVE 失败时停止写入，避免误以为数据已持久化；恢复后自动放开。
stop-writes-on-bgsave-error yes

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# 数据目录与 compose 的 ${DOCKER_VOLUME_DIRECTORY:-.}/redis/data 挂载对应。
dir /data
rdb-save-incremental-fsync yes

################################## APPEND ONLY FILE ##########################

# 保持 RDB 模式，默认不启用 AOF。
# 注意：如果数据目录已有 dump.rdb，仅修改配置启用 AOF 后重启，Redis 会优先
# 加载 AOF 而忽略旧 RDB，可能造成数据丢失；应先在线执行
# CONFIG SET appendonly yes，等待 AOF rewrite 完成后再持久化该配置。
appendonly no

# 需要更高持久性时，先在线切换，再把上面的 appendonly no 改为 yes（不要重复添加），
# 并按需启用以下参数：
# appendfilename "appendonly.aof"
# appenddirname "appendonlydir"
# appendfsync everysec
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb
# aof-load-truncated yes
# aof-use-rdb-preamble yes
# aof-rewrite-incremental-fsync yes
# aof-timestamp-enabled no

################################# PERFORMANCE #################################

# I/O 多线程：Redis 8.8.4 已移除 io-threads-do-reads，启用时只写 io-threads。
# 官方建议仅在 >=4 核且 Redis 确实出现 CPU/网络瓶颈时开启；容器 CPU 较少
# 或未做压测前保持注释（单线程），避免线程切换反而降低性能。
# io-threads 4

# 后台任务频率；dynamic-hz 在客户端较多时自动提高 hz。
hz 10
dynamic-hz yes

# 逐步 rehash，降低大字典扩容时的延迟抖动。
activerehashing yes

# jemalloc 后台线程归还内存；容器内可减少 RSS 长期占用。
jemalloc-bg-thread yes

# 关闭透明大页，避免 fork/BGSAVE 时 THP 导致的延迟尖刺。
disable-thp yes

# 延迟监控默认关闭；排查性能问题时可临时 CONFIG SET latency-monitor-threshold 100。
latency-monitor-threshold 0
