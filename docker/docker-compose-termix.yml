services:
  x-termix:
    container_name: x-termix
    # https://docs.termix.site/install/server/docker
    image: termixssh/termix:26.10.6
    restart: unless-stopped
    # Node 进程上限，可按宿主机内存和实际负载覆盖
    mem_limit: "${TERMIX_MEM_LIMIT:-512m}"
    ports:
      - "9980:8080"
    volumes:
      # 默认 SQLite 及 MySQL 模式下都保留：密钥、插件和上传文件存放在 DATA_DIR
      - ${DOCKER_VOLUME_DIRECTORY:-.}/termix/data:/app/data
    extra_hosts:
      # 仅在启用 MySQL/PostgreSQL 时经宿主机端口访问；默认 SQLite 不受影响
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      # 留空时 Termix 默认使用 SQLite；在 docker/.env 配置 TERMIX_DB_* 后切换
      DATABASE_DIALECT: "${TERMIX_DB_DIALECT:-}"
      DATABASE_URL: "${TERMIX_DB_URL:-}"
      DATABASE_POOL_MAX: "${TERMIX_DB_POOL_MAX:-}"
    depends_on:
      - x-guacd
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - net-termix

  x-guacd:
    container_name: x-guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    # guacd 为轻量 C 守护进程，主要开销在 RDP/VNC 会话
    mem_limit: "${GUACD_MEM_LIMIT:-256m}"
    ports:
      - "9922:4822"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - net-termix

networks:
  net-termix:
    driver: bridge